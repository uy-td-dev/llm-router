name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.1); defaults to a short SHA"
        required: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------ gate
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove local cross-build config (force native target)
        run: rm -rf .cargo
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build router (release)
        run: cargo build --release
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build dashboard
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

  # ------------------------------------------------------------------ binaries
  build-binaries:
    name: Build binary (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove local cross-build config (force native target)
        run: rm -rf .cargo
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"
          STAGE="llm-router-${T}"
          mkdir -p "$STAGE"
          BIN="target/${T}/release/llm-router"
          [ -f "$BIN" ] || BIN="target/${T}/release/llm-router.exe"
          cp "$BIN" "$STAGE/llm-router"
          cp -r config "$STAGE/"
          cp README.md DOCKER.md docker-compose.yml "$STAGE/"
          chmod +x "$STAGE/llm-router"
          tar czf "llm-router-${T}.tar.gz" "$STAGE"
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $T = "${{ matrix.target }}"
          $stage = "llm-router-$T"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bin = "target/$T/release/llm-router.exe"
          Copy-Item $bin "$stage/llm-router.exe"
          Copy-Item -Recurse config "$stage/"
          Copy-Item README.md, DOCKER.md, docker-compose.yml $stage/
          Compress-Archive -Path "$stage" -DestinationPath "llm-router-$T.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: llm-router-${{ matrix.target }}.*

  # ------------------------------------------------------------------ web
  build-web:
    name: Build dashboard (standalone)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install & build
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Package standalone
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          STAGE="llm-router-web-standalone"
          mkdir -p "$STAGE"
          cp -r .next/standalone/* "$STAGE/"
          mkdir -p "$STAGE/.next/static"
          cp -r .next/static/* "$STAGE/.next/static/"
          cp -r public "$STAGE/" 2>/dev/null || true
          tar czf "../llm-router-web-standalone.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: llm-router-web-standalone.tar.gz

  # ------------------------------------------------------------------ docker
  docker:
    name: Build & push Docker images (GHCR)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta-router
        with:
          images: ghcr.io/${{ github.repository }}/router
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/metadata-action@v5
        id: meta-web
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-router.outputs.tags }}
          labels: ${{ steps.meta-router.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ release
  release:
    name: Publish GitHub release
    needs: [build-binaries, build-web, docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/llm-router-*
            dist/llm-router-web-standalone.tar.gz
            docker-compose.yml
            DOCKER.md
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[package]
name = "llm-router"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config
config = "0.14"
serde_yaml = "0.9"

# Database (for Phase 3)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "migrate"], optional = true }
# SQLite persistence (always available; bundled = self-contained driver)
rusqlite = { version = "0.32", features = ["bundled"] }

# Redis cache (for Phase 5)
fred = { version = "9.0", optional = true }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Rate limiting (for Phase 6)
governor = { version = "0.6", optional = true }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.7"
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Environment variables
dotenvy = "0.15"

# Lazy statics
once_cell = "1.20"

[dev-dependencies]
mockito = "1.5"
tokio-test = "0.4"

[features]
default = []
full = ["sqlx", "fred", "governor"]
